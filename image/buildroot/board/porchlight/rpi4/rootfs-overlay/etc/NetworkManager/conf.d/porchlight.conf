# porchlight-setup.py raises its access point with ipv4.method=shared, which
# NetworkManager normally pairs with NAT rules so the phone can reach the
# internet through the device. There is nothing to share: the one radio is the
# access point, and the phone only ever talks to the setup page. The image has
# neither nft nor iptables, so say so rather than let NetworkManager look.
[main]
firewall-backend=none

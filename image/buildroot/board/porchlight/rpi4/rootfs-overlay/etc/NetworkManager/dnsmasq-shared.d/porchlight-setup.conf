# The captive portal for porchlight-setup.py's access point. Sends every name
# to the device itself, which is what makes the setup page open by itself
# instead of the customer being told an IP address. Only the shared (access
# point) connection's dnsmasq reads this directory. Shipped here because /etc
# is read-only; setup.py writes it only where it is missing.
address=/#/192.168.4.1

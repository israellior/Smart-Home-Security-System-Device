# The Wi-Fi country. Without one the kernel uses the world domain, and every
# scan asks the chip for channels it refuses (14, and 34-46 on 5 GHz: Japan
# only), logging "brcmf_set_channel: set chanspec ... fail, reason -52" for each.
# The rules for IL come from /lib/firmware/regulatory.db (wireless-regdb).
#
# Fixed here for one desk in Israel. A device that ships to more than one
# country has to learn this at setup time, not from the image.
options cfg80211 ieee80211_regdom=IL

# A Pi has no battery-backed clock. A fresh unit boots in the past, and every
# DNSSEC signature looks expired until the clock is set - but setting the clock
# needs DNS to find an NTP server. With validation on, a first boot answered
# "signature-expired" to every lookup and phone setup failed as no-dns.
#
# Nothing is lost by turning it off here: everything the doorbell talks to is
# HTTPS, and the TLS certificate check proves the server's name - with setup
# waiting for a synced clock before it makes that check.
#
# No mDNS or LLMNR: nothing here finds or is found by name on the LAN. With
# mDNS on, a reverse lookup of a LAN address nobody claims waited 7.6 s for
# multicast answers, and dropbear makes one for every connection - so every
# SSH login took eight seconds and scripts timed out. LLMNR, besides, answers
# to anyone on the network who claims a name first.
[Resolve]
DNSSEC=no
MulticastDNS=no
LLMNR=no

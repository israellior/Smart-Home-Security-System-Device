# The boot partition is mounted read-only on this image: both slots boot
# from it and nothing else writes it. firstboot is the exception - it has to
# overwrite and remove the birth certificate, which holds the credential -
# so the partition is writable only while there is a certificate, and only
# while firstboot runs. Every other boot leaves the FAT untouched, and a power
# cut finds nothing on it half-written.
#
# $$ is systemd's escape for a $ the shell should see; a single $ here would
# be expanded by systemd itself, to nothing.
[Service]
ExecStart=
ExecStart=/bin/sh -c '\
	if [ -e /boot/firmware/porchlight.json ]; then mount -o remount,rw /boot/firmware; fi; \
	/usr/local/lib/porchlight/porchlight-firstboot.py; status=$$?; \
	mount -o remount,ro /boot/firmware; \
	exit $$status'

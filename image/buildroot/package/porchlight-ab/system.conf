# RAUC's description of this device: what it accepts, and where it writes.

[system]
# A bundle must name exactly this, or RAUC refuses it - so an image built for
# some other board can never be written over this one.
compatible=porchlight-rpi4
# The slot to boot next goes through U-Boot's environment (fw_setenv,
# configured by /etc/fw_env.config): BOOT_ORDER and BOOT_A_LEFT / BOOT_B_LEFT,
# which boot.scr reads.
bootloader=uboot
# On the data partition, so what RAUC knows about each slot survives the
# update that replaces the slot it is running from.
data-directory=/data/rauc
# Where a bundle is mounted while it installs. The default, /mnt/rauc, is on
# the read-only root, and every install failed creating it. Release-4 ships
# with that default: a device on it needs `rauc --mount=/run/rauc install`.
# "mountprefix", not "mount-prefix" like the keys around it: release-6 had the
# hyphen, and RAUC refused the whole file - no install, no mark-good, nothing.
mountprefix=/run/rauc

[keyring]
# The certificate a bundle's signature must chain to. The private key that
# signs is not on the device and not in the repository.
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B

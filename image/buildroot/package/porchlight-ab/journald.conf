# Keep the log across reboots, on /data (porchlight-data bind-mounts it at
# /var/log/journal). Without this a bad boot erases its own evidence: a slot
# that booted, stayed off the network and was unplugged left nothing behind.
#
# /data also carries an update bundle while it installs (120 MB of 256), so
# the log is held to a small, fixed share and journald drops the oldest first.
[Journal]
Storage=persistent
SystemMaxUse=32M

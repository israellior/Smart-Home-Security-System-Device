# The Pi's hardware watchdog (bcm2835-wdt), fed by systemd. If the system hangs
# hard enough that systemd stops feeding it, the chip resets the Pi - and on an
# update that never got as far as porchlight-health, that reboot spends one of
# the slot's three attempts in boot.scr, so even a hang ends in a fallback.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min

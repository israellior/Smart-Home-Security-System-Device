<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi WebRTC · Step 3</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2; --card: #ffffff; --border: #e3e1dc;
    --fg: #1d1d1b; --muted: #6b6a66; --accent: #2f6fed; --live: #1f9d55; --bad: #c9382e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --border: #33332f;
      --fg: #ecebe7; --muted: #9b9a95; --accent: #5b8cff; --live: #4cc38a; --bad: #e5574c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    display: grid; place-items: start center;
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    width: 100%; max-width: 680px; padding: 24px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  }
  h1 { margin: 0 0 4px; font-size: 1.25rem; font-weight: 600; }
  p.lead { margin: 0 0 20px; color: var(--muted); font-size: 0.875rem; }
  button {
    width: 100%; padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
    font: inherit; font-weight: 600; color: #fff; background: var(--accent);
  }
  button.on { background: var(--muted); }
  button.mini {
    width: auto; flex: 0 0 auto; padding: 5px 12px; border-radius: 8px;
    font-size: 0.75rem; font-weight: 600;
  }
  button.mini.muted { background: var(--bad); }
  button:disabled { opacity: 0.45; cursor: default; }
  #notice {
    margin: 0 0 16px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--bad); color: var(--fg);
    font-size: 0.8125rem; line-height: 1.5;
  }
  #notice a { color: var(--accent); }
  video {
    width: 100%; margin-top: 16px; aspect-ratio: 4 / 3; border-radius: 12px;
    background: #000; display: block;
  }
  #status { margin: 16px 0 4px; }
  #status::before {
    content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px;
    border-radius: 50%; background: var(--muted); vertical-align: middle;
  }
  #status.live::before { background: var(--live); }
  #status.error::before { background: var(--bad); }
  .clocks {
    display: flex; gap: 16px; align-items: baseline; margin-top: 12px;
    font-variant-numeric: tabular-nums;
  }
  .clocks span:first-child { color: var(--muted); font-size: 0.8125rem; }
  #browserClock { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.125rem; }
  .meter { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  .meter > span { flex: 0 0 8.5em; color: var(--muted); font-size: 0.8125rem; }
  .meter .bar {
    flex: 1; height: 8px; border-radius: 4px;
    background: var(--bg); border: 1px solid var(--border); overflow: hidden;
  }
  .meter i { display: block; height: 100%; width: 0; background: var(--live); }
  .meter i.mine { background: var(--accent); }
  table { width: 100%; margin-top: 16px; border-collapse: collapse; font-size: 0.8125rem; }
  td { padding: 3px 0; color: var(--muted); font-variant-numeric: tabular-nums; }
  td:first-child { width: 42%; }
  td:last-child { color: var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; }
  #log {
    margin-top: 16px; max-height: 180px; overflow-y: auto; padding: 10px 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.75rem;
    line-height: 1.6; color: var(--muted); white-space: pre-wrap;
  }
</style>
</head>
<body>
<main>
  <h1>Pi WebRTC · Step 3</h1>
  <p class="lead">
    A call. The Pi sends a test pattern and its microphone; this browser sends yours
    back. One connection, three tracks.
  </p>

  <p id="notice" hidden></p>

  <button id="toggle" type="button">Connect</button>
  <!-- Deliberately not muted: a muted element plays the video and silently throws
       away the whole point of Step 2. The price is that the browser may refuse to
       start playback on its own; see the play() call below. -->
  <video id="video" autoplay playsinline></video>
  <p id="status">Idle</p>

  <div class="clocks">
    <span>Pi clock is burnt into the picture · this browser:</span>
    <span id="browserClock">--:--:--.---</span>
  </div>

  <div class="meter">
    <span>Pi microphone</span>
    <div class="bar"><i id="remoteLevel"></i></div>
  </div>
  <div class="meter">
    <span>Your microphone</span>
    <div class="bar"><i id="localLevel" class="mine"></i></div>
    <button id="mute" class="mini" type="button" disabled>Mute</button>
  </div>

  <table id="stats"></table>
  <div id="log"></div>
</main>
<script>
'use strict';

// On a LAN the two machines can reach each other directly, so ICE finds host
// candidates on its own and no STUN or TURN server is needed. The empty list is
// deliberate, not an omission.
const ICE_SERVERS = [];

// The quietest level the meters bother to draw. Below about -60 dBFS everything
// looks identical anyway, and a room's noise floor sits well above it.
const METER_FLOOR_DB = -60;

// Let the browser do the half of echo cancellation it can: it knows what it is
// playing out of its own speakers, so it can subtract that from what its own
// microphone hears. It knows nothing about the Pi's speaker hearing the Pi's
// microphone - that is the other half, and that is Step 4's webrtcdsp.
//
// channelCount is deliberately not requested: asking for it can make Chrome pick
// a different, worse capture path, and audioconvert on the Pi downmixes anyway.
const MIC_CONSTRAINTS = {
  audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  video: false,
};

const button = document.getElementById('toggle');
const muteButton = document.getElementById('mute');
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const statsEl = document.getElementById('stats');
const logEl = document.getElementById('log');
const clockEl = document.getElementById('browserClock');
const noticeEl = document.getElementById('notice');
const remoteLevelEl = document.getElementById('remoteLevel');
const localLevelEl = document.getElementById('localLevel');

let socket = null;
let pc = null;
let myId = null;
let piId = null;
let requested = false; // we only ask the Pi for an offer once per connection
let pendingIce = []; // candidates that arrived before the offer did
let statsTimer = null;
let lastReport = null;
let remoteStream = null; // both incoming tracks, collected into one stream
let localStream = null; // our microphone, or null if we could not get one

button.addEventListener('click', () => (socket ? stop('Stopped') : start()));
muteButton.addEventListener('click', toggleMute);

// If the browser refused to start playback by itself, a click on the video is a
// user gesture and will be allowed. Harmless when it is already playing.
video.addEventListener('click', () => video.play().catch(() => {}));

// The Pi burns its own wall clock into the video. Showing this browser's clock
// next to it turns the delay into something you can simply read off the screen.
setInterval(() => {
  const d = new Date();
  clockEl.textContent =
    `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:` +
    `${String(d.getSeconds()).padStart(2, '0')}.${String(d.getMilliseconds()).padStart(3, '0')}`;
}, 50);

// getUserMedia is refused outright outside a secure context, and plain http:// to
// a LAN address is not one. http://localhost is, with no certificate anywhere, so
// say that rather than letting the permission call fail with a bare error.
if (!window.isSecureContext || !navigator.mediaDevices) {
  const here = `http://localhost:${location.port || '80'}${location.pathname}`;
  noticeEl.hidden = false;
  noticeEl.innerHTML =
    'This page is not a <strong>secure context</strong>, so the browser will not ' +
    'hand over your microphone and talking back is impossible. On the machine ' +
    `running the server, open <a href="${here}">${here}</a> instead. ` +
    'From any other machine it needs HTTPS. Video and the Pi\'s microphone still ' +
    'work here — only the way back is lost.';
}

function log(line) {
  const t = new Date().toTimeString().slice(0, 8);
  logEl.textContent += `${t}  ${line}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.classList.toggle('live', kind === 'live');
  statusEl.classList.toggle('error', kind === 'error');
}

function send(msg) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(msg));
}

// --- our microphone ----------------------------------------------------------

async function acquireMic() {
  if (!window.isSecureContext || !navigator.mediaDevices) {
    log('no microphone: this page is not a secure context');
    return null;
  }
  try {
    // Asked for on the Connect click, so the permission prompt belongs to a
    // gesture the user just made rather than arriving out of nowhere.
    const stream = await navigator.mediaDevices.getUserMedia(MIC_CONSTRAINTS);
    const track = stream.getAudioTracks()[0];
    log(`microphone: ${track.label || 'default device'}`);
    return stream;
  } catch (err) {
    // NotAllowedError is a refusal, NotFoundError is no device at all. Either
    // way the call still works one way, so this is a note and not a failure.
    log(`no microphone (${err.name}): listening only`);
    return null;
  }
}

function toggleMute() {
  if (!localStream) return;
  const track = localStream.getAudioTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  muteButton.textContent = track.enabled ? 'Mute' : 'Unmute';
  muteButton.classList.toggle('muted', !track.enabled);
  log(track.enabled ? 'microphone live' : 'microphone muted');
}

function releaseMic() {
  if (localStream) {
    // Without this the browser keeps showing its recording indicator and holds
    // the device open against the next run.
    localStream.getTracks().forEach((t) => t.stop());
    localStream = null;
  }
  muteButton.disabled = true;
  muteButton.textContent = 'Mute';
  muteButton.classList.remove('muted');
}

// --- connecting --------------------------------------------------------------

async function start() {
  logEl.textContent = '';
  requested = false;
  pendingIce = [];
  piId = null;

  button.disabled = true;
  setStatus('Asking for your microphone…', null);
  localStream = await acquireMic();
  button.disabled = false;
  if (localStream) {
    muteButton.disabled = false;
    addMeter(localStream, localLevelEl);
  }

  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`);
  ws.onopen = () => {
    log('signaling connected');
    ws.send(JSON.stringify({ type: 'hello', role: 'browser' }));
  };
  ws.onmessage = (e) => {
    if (socket !== ws) return;
    onSignal(JSON.parse(e.data));
  };
  ws.onclose = () => {
    if (socket === ws) stop('Signaling disconnected');
  };
  socket = ws;

  setStatus('Connecting…', null);
  button.textContent = 'Disconnect';
  button.classList.add('on');
  statsTimer = setInterval(renderStats, 500);
}

function stop(message) {
  const ws = socket;
  socket = null;
  if (ws) ws.close();
  if (pc) {
    pc.close();
    pc = null;
  }
  stopMeters();
  releaseMic();
  video.srcObject = null;
  remoteStream = null;
  clearInterval(statsTimer);
  statsEl.innerHTML = '';
  lastReport = null;
  setStatus(message, null);
  button.disabled = false;
  button.textContent = 'Connect';
  button.classList.remove('on');
}

// --- the level meters --------------------------------------------------------
// Silence has several very different causes - a dead microphone, a muted track,
// playback the browser never started - and these bars tell them apart. Each one
// moves as soon as samples exist, whether or not anything reaches a speaker.

let audioCtx = null;
let meterTimer = null;
// Every node has to stay referenced for as long as its meter runs. A Web Audio
// node whose last reference is dropped can be collected, and the graph then goes
// quiet with no error anywhere at all.
const meters = [];

function addMeter(stream, bar) {
  if (!stream || stream.getAudioTracks().length === 0) return;
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    // A context created outside a user gesture starts suspended, and a suspended
    // context's analyser returns nothing but zeroes.
    audioCtx.resume().catch(() => {});
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    const source = audioCtx.createMediaStreamSource(stream);
    // Read from it, but never connect it onward to the destination: these
    // streams are already being played (or are our own microphone, which must
    // never be), and a second path would only duplicate or echo them.
    source.connect(analyser);
    meters.push({ source, analyser, buffer: new Float32Array(analyser.fftSize), bar });
    if (!meterTimer) meterTimer = setInterval(drawMeters, 100);
  } catch (err) {
    log(`level meter unavailable: ${err.message}`);
  }
}

function drawMeters() {
  for (const m of meters) {
    m.analyser.getFloatTimeDomainData(m.buffer);
    let sum = 0;
    for (let i = 0; i < m.buffer.length; i++) sum += m.buffer[i] * m.buffer[i];
    const rms = Math.sqrt(sum / m.buffer.length);
    // dBFS, not raw amplitude: speech is far quieter than full scale, and a
    // linear bar leaves an ordinary voice indistinguishable from silence.
    const db = rms > 0 ? 20 * Math.log10(rms) : -Infinity;
    const fraction = Math.max(0, Math.min(1, (db - METER_FLOOR_DB) / -METER_FLOOR_DB));
    m.bar.style.width = `${(fraction * 100).toFixed(1)}%`;
  }
}

function stopMeters() {
  clearInterval(meterTimer);
  meterTimer = null;
  meters.length = 0;
  if (audioCtx) audioCtx.close().catch(() => {});
  audioCtx = null;
  remoteLevelEl.style.width = '0';
  localLevelEl.style.width = '0';
}

// --- signaling ---------------------------------------------------------------

function onSignal(msg) {
  switch (msg.type) {
    case 'welcome':
      myId = msg.id;
      log(`signed in as browser #${myId}`);
      break;

    case 'status':
      // The Pi may sign in before or after we do, so this is the one place that
      // decides when to ask. Asking twice would build a second pipeline.
      piId = msg.pi;
      if (piId === null) {
        setStatus('Connected, but no Pi is signed in', null);
        log('waiting for the Pi to run webrtc-video.py');
      } else if (!requested) {
        requested = true;
        log(`Pi is #${piId}, asking it for an offer`);
        setStatus('Asking the Pi for an offer…', null);
        send({ type: 'request-offer', to: piId });
      }
      break;

    case 'offer':
      answerOffer(msg).catch((err) => {
        log(`failed to answer: ${err.message}`);
        setStatus(`Failed: ${err.message}`, 'error');
      });
      break;

    case 'ice':
      if (!pc || !pc.remoteDescription) {
        // GStreamer starts gathering the moment it sets its local description,
        // so its first candidates can overtake the offer. Hold them.
        pendingIce.push(msg.candidate);
      } else {
        pc.addIceCandidate(msg.candidate).catch((err) => log(`bad candidate: ${err.message}`));
      }
      break;

    case 'peer-left':
      if (msg.id === piId) {
        log('the Pi went away');
        setStatus('The Pi disconnected', 'error');
        if (pc) {
          pc.close();
          pc = null;
        }
        stopMeters();
        video.srcObject = null;
        remoteStream = null;
        requested = false;
      }
      break;

    case 'signal-error':
      log(`server could not deliver ${msg.about} to #${msg.to}`);
      break;
  }
}

// Pull the m-lines out of an SDP, in order, with their mid and direction. Enough
// to find which one the Pi is offering to *receive* on, which is the only way to
// know where our microphone belongs.
function readMediaLines(sdp) {
  const out = [];
  let current = null;
  for (const line of sdp.split(/\r?\n/)) {
    if (line.startsWith('m=')) {
      current = { kind: line.slice(2).split(' ')[0], mid: null, direction: null };
      out.push(current);
    } else if (current) {
      if (line.startsWith('a=mid:')) current.mid = line.slice(6).trim();
      else if (/^a=(sendrecv|sendonly|recvonly|inactive)\s*$/.test(line)) {
        current.direction = line.slice(2).trim();
      }
    }
  }
  return out;
}

// addTrack would pick the first audio transceiver with no sender - which is the
// one carrying the Pi's microphone towards us, not the one waiting for ours. So
// the right transceiver is found explicitly, by the mid of the m-line the Pi
// marked recvonly.
async function attachMicrophone(offerSdp) {
  if (!localStream) return;
  const track = localStream.getAudioTracks()[0];
  if (!track) return;

  const wanted = readMediaLines(offerSdp).find(
    (m) => m.kind === 'audio' && m.direction === 'recvonly'
  );
  if (!wanted) {
    log('the Pi did not offer to receive audio (--no-talkback?); not sending ours');
    return;
  }
  const transceiver = pc.getTransceivers().find((t) => t.mid === wanted.mid);
  if (!transceiver) {
    log(`no transceiver for m-line ${wanted.mid}; not sending our microphone`);
    return;
  }
  await transceiver.sender.replaceTrack(track);
  // recvonly on their side, sendonly on ours. sendrecv would promise them a
  // direction they never asked for.
  transceiver.direction = 'sendonly';
  log(`sending our microphone on m-line ${wanted.mid}`);
}

async function answerOffer(msg) {
  log(`offer received (${msg.sdp.length} bytes of SDP)`);
  console.log('--- offer from the Pi ---\n' + msg.sdp);
  const media = readMediaLines(msg.sdp);
  log(`offer describes ${media.length} media: ${media.map((m) => `${m.kind}/${m.direction}`).join(', ')}`);

  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  // One MediaStream of our own, built here and handed to the element once. Both
  // incoming tracks go into it whatever stream ids the Pi put in the offer, and
  // one element rendering one stream is what lets the browser line sound up with
  // picture instead of playing each as fast as it arrives.
  remoteStream = new MediaStream();
  video.srcObject = remoteStream;

  pc.ontrack = (e) => {
    log(`track arrived: ${e.track.kind}`);
    remoteStream.addTrack(e.track);
    if (e.track.kind === 'audio') addMeter(remoteStream, remoteLevelEl);
    setStatus('Live', 'live');
    // Autoplay with sound is not always allowed, and an element that silently
    // refused to start looks exactly like a microphone that captured nothing.
    video.play().catch((err) => {
      log(`playback blocked: ${err.message}`);
      setStatus('Click the video to start playback', 'error');
    });
  };
  pc.onicecandidate = (e) => {
    if (e.candidate) send({ type: 'ice', to: msg.from, candidate: e.candidate.toJSON() });
  };
  pc.oniceconnectionstatechange = () => log(`ICE ${pc.iceConnectionState}`);
  pc.onconnectionstatechange = () => {
    log(`connection ${pc.connectionState}`);
    if (pc.connectionState === 'failed') setStatus('Connection failed', 'error');
  };

  await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
  for (const candidate of pendingIce) {
    await pc.addIceCandidate(candidate).catch((err) => log(`bad queued candidate: ${err.message}`));
  }
  pendingIce = [];

  // Before createAnswer, not after: the answer has to describe our microphone,
  // and an answer is a snapshot of what the transceivers say at that moment.
  await attachMicrophone(msg.sdp);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  console.log('--- answer we sent ---\n' + answer.sdp);
  send({ type: 'answer', to: msg.from, sdp: answer.sdp });
  log('answer sent');
}

// --- stats -------------------------------------------------------------------

function kbps(now, before, field) {
  if (!before) return null;
  const dt = (now.timestamp - before.timestamp) / 1000;
  if (!(dt > 0)) return null;
  return ((now[field] - before[field]) * 8) / dt / 1000;
}

function bufferMs(s) {
  if (s.jitterBufferDelay == null || !s.jitterBufferEmittedCount) return null;
  return (s.jitterBufferDelay / s.jitterBufferEmittedCount) * 1000;
}

async function renderStats() {
  if (!pc) return;
  const report = await pc.getStats();
  const rows = [];

  let videoIn = null;
  let audioIn = null;
  let audioOut = null;
  let pair = null;
  const byId = new Map();
  report.forEach((s) => byId.set(s.id, s));
  report.forEach((s) => {
    if (s.type === 'inbound-rtp' && s.kind === 'video') videoIn = s;
    if (s.type === 'inbound-rtp' && s.kind === 'audio') audioIn = s;
    if (s.type === 'outbound-rtp' && s.kind === 'audio') audioOut = s;
    if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') pair = s;
  });

  if (videoIn) {
    rows.push(['resolution', `${videoIn.frameWidth || 0} × ${videoIn.frameHeight || 0}`]);
    const rate = kbps(videoIn, lastReport && lastReport.video, 'bytesReceived');
    if (rate != null) {
      const dt = (videoIn.timestamp - lastReport.video.timestamp) / 1000;
      const fps = (videoIn.framesDecoded - lastReport.video.framesDecoded) / dt;
      rows.push(['video in', `${rate.toFixed(0)} kbps, ${fps.toFixed(1)} fps`]);
    }
    rows.push(['video lost', videoIn.packetsLost ?? 0]);
  }

  if (audioIn) {
    const rate = kbps(audioIn, lastReport && lastReport.audio, 'bytesReceived');
    rows.push(['audio in', rate == null ? '—' : `${rate.toFixed(1)} kbps`]);
    rows.push(['audio lost', audioIn.packetsLost ?? 0]);
    rows.push(['audio jitter', `${((audioIn.jitter ?? 0) * 1000).toFixed(1)} ms`]);
    const buf = bufferMs(audioIn);
    if (buf != null) rows.push(['audio jitter buffer', `${buf.toFixed(0)} ms`]);
    // How far apart the two incoming tracks are being played. RTCP sender
    // reports put both on the Pi's clock, so this has to stay near zero once
    // there is a real camera and a real mouth to match it to.
    if (videoIn && audioIn.estimatedPlayoutTimestamp && videoIn.estimatedPlayoutTimestamp) {
      const skew = audioIn.estimatedPlayoutTimestamp - videoIn.estimatedPlayoutTimestamp;
      rows.push(['A/V skew', `${skew >= 0 ? '+' : ''}${skew.toFixed(0)} ms (audio − video)`]);
    }
  } else {
    rows.push(['audio in', 'no track — the Pi sent video only']);
  }

  // The way back. Bytes leaving is the only proof our microphone is reaching the
  // Pi at all; the local level bar only proves the browser can hear itself.
  if (audioOut) {
    const rate = kbps(audioOut, lastReport && lastReport.out, 'bytesSent');
    rows.push(['your mic out', rate == null ? '—' : `${rate.toFixed(1)} kbps`]);
    rows.push(['packets sent', audioOut.packetsSent ?? 0]);
  } else if (localStream) {
    rows.push(['your mic out', 'not negotiated']);
  } else {
    rows.push(['your mic out', 'no microphone']);
  }

  if (pair) {
    const local = byId.get(pair.localCandidateId);
    const remote = byId.get(pair.remoteCandidateId);
    if (pair.currentRoundTripTime != null) {
      rows.push(['round trip', `${(pair.currentRoundTripTime * 1000).toFixed(1)} ms`]);
    }
    if (local && remote) {
      // Both "host" means the packets go straight between the two machines and
      // never touch server.js. One pair for three tracks means bundling worked.
      rows.push(['route', `${local.candidateType} → ${remote.candidateType}`]);
      rows.push(['media from', `${remote.address}:${remote.port} (${remote.protocol})`]);
    }
  }

  statsEl.innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  lastReport = { video: videoIn, audio: audioIn, out: audioOut };
}
</script>
</body>
</html>
